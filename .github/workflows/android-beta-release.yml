name: Android beta release

on:
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: write

concurrency:
  group: android-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Install the pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-33" "build-tools;30.0.3"

      - name: Verify tag and Gradle versions
        shell: pwsh
        run: ./android/scripts/verify-beta-version.ps1 -Tag "${{ github.ref_name }}" -CheckGitHistory

      - name: Require the optional signing-key secret
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.DICTA_BETA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "::error::Missing DICTA_BETA_KEYSTORE_BASE64. Configure it from the trusted local beta-debug.keystore before pushing a release tag."
            exit 1
          fi

      - name: Reconstruct the exact beta keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.DICTA_BETA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/beta-debug.keystore
          chmod 600 android/beta-debug.keystore
          expected="$(tr -d '[:space:]' < android/keystore-file-sha256.txt)"
          actual="$(sha256sum android/beta-debug.keystore | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::The reconstructed keystore is not the trusted beta keystore."
            exit 1
          fi

      - name: Test and build the signed beta APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testBetaDebugUnitTest assembleBetaDebug

      - name: Verify the APK signing certificate
        shell: pwsh
        run: ./android/scripts/verify-android-signing.ps1

      - name: Prepare the release asset
        shell: bash
        run: cp android/app/build/outputs/apk/beta/debug/app-beta-debug.apk "$RUNNER_TEMP/copy-challenge-beta.apk"

      - name: Publish the GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            "$RUNNER_TEMP/copy-challenge-beta.apk#copy-challenge-beta.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "Copy Challenge Android ${GITHUB_REF_NAME#v}" \
            --generate-notes
